<!DOCTYPE html>
<html lang="en">
<!-- 
    Netball Game Timer
    (c) 2026 Mike Harris harmic@gmail.com 
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netball Game Timer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --primary-color: #003366; --accent-color: #aa1334; --edit-bg: #fffcf0; --calc-bg: #f1f3f5; }
        body { background-color: #f8f9fa; font-family: sans-serif; overflow-x: hidden; }
        
        /* Updated Header Styling */
        .header-bar { 
            background: white; 
            color: black; 
            padding: 0.5rem 1rem; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 5px solid var(--accent-color);
        }
        .logo-container img {
            height: 64px; /* Approx 70% of original 91px height */
            width: auto;
        }
        
        /* Redesigned Status Bar */
        .status-bar { 
            background: #222; 
            color: #00ff00; 
            padding: 1rem 2rem; 
            border-bottom: 4px solid #444; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 2.5rem; 
            font-weight: bold;
            font-family: monospace;
        }
        .status-left { flex: 0 0 auto; }
        .status-right { flex: 1 1 auto; text-align: right; text-transform: uppercase; letter-spacing: 1px; }

        .table-container { padding: 20px; overflow-x: auto; }
        table { table-layout: fixed; width: 100%; }
        
        .editable { 
            background-color: var(--edit-bg) !important; 
            cursor: text; 
            border: 1px solid #ffe066 !important;
            font-weight: 500;
            padding: 0 !important;
            position: relative;
        }
        .editable:hover { background-color: #fff3bf !important; }
        .calculated { 
            background-color: var(--calc-bg) !important; 
            color: #6c757d; 
            font-style: italic;
            font-size: 0.85rem;
        }

        /* Next Event Highlighting */
        .next-event-highlight {
            background-color: #fd7e14 !important;
            color: white !important;
            font-weight: bold !important;
            font-style: normal !important;
            animation: pulse-highlight 2s infinite;
        }

        @keyframes pulse-highlight {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        input.cell-edit { 
            width: 100%; 
            height: 100%;
            border: 2px solid #228be6; 
            background: white; 
            text-align: center; 
            font-weight: bold; 
            outline: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        .btn-siren { background-color: #e03131; color: white; }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="d-flex align-items-center">
            <div class="logo-container"><img src="wdna-logo.jpg" alt="WDNA Logo"></div>
            <h1 class="h4 mb-0 ms-3">WDNA Game Timer</h1>
        </div>
        <div class="dropdown">
            <button class="btn btn-outline-dark btn-sm" data-bs-toggle="dropdown"><i data-lucide="settings"></i></button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="openSaveDialog()">Save ...</a></li>
                <li><a class="dropdown-item" href="#" onclick="openLoadDialog()">Load ...</a></li>
            </ul>
        </div>
    </header>

    <nav class="p-2 bg-light border-bottom d-flex gap-2 align-items-center">
        <button class="btn btn-success" onclick="startTimer()">Start</button>
        <button class="btn btn-danger" onclick="stopTimer()">Stop</button>
        <select id="periodSelect" class="form-select w-auto ms-auto" onchange="handlePeriodChange()">
            <option value="4">4 Quarters</option>
            <option value="4et">4 Quarters w/ Extra Time</option>
            <option value="2">2 Halves</option>
        </select>
        <select id="buzzerSelect" class="form-select w-auto" onchange="handleBuzzerChange()">
            <option value="buzzer1.mp3">Buzzer 1</option>
            <option value="buzzer2.mp3">Buzzer 2</option>
            <option value="siren2.mp3">Siren 2</option>
            <option value="siren.mp3" selected>Siren</option>
        </select>
        <button class="btn btn-siren" onclick="manualSiren()">Siren</button>
    </nav>

    <div class="status-bar" id="statusBar">
        <div class="status-left" id="clockLayer">00:00:00</div>
        <div class="status-right" id="eventLayer">READY</div>
    </div>

    <div class="table-container">
        <table class="table table-bordered table-sm align-middle text-center" id="roundTable">
            <thead class="table-dark">
                <!-- Dynamically populated -->
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="mt-2">
            <button class="btn btn-outline-primary btn-sm" onclick="addRound()">+ Add Next Round</button>
            <button class="btn btn-outline-secondary btn-sm ms-2" onclick="clearSchedule()">Clear Schedule</button>
        </div>
    </div>

    <!-- Save Dialog -->
    <div class="modal fade" id="saveModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Save Schedule</h5></div>
                <div class="modal-body">
                    <label class="form-label">Name</label>
                    <input type="text" id="saveNameInput" class="form-control">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary btn-sm" onclick="confirmSave()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Dialog -->
    <div class="modal fade" id="loadModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Load Schedule</h5></div>
                <div class="modal-body">
                    <label class="form-label">Saved schedules</label>
                    <select id="loadSelect" class="form-select"></select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary btn-sm" onclick="confirmLoad()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="sndWarning" src="30sec_warning.mp3"></audio>
    <audio id="sndStart" src="qtr_start.mp3"></audio>
    <audio id="sndEnd" src="qtr_end.mp3"></audio>
    <audio id="sndSiren" src="siren.mp3"></audio>

    <script>
        let rounds = [];
        let isRunning = false;
        let nextEventTarget = null; // Stores {roundIdx, fieldKey}
        let wakeLock = null; // Screen Wake Lock handle
        let periodMode = '4'; // '4', '4et', or '2'
        let buzzerTone = 'siren.mp3'; // selected buzzer/siren audio file
        let EDITABLE_FIELDS = [];
        const STORAGE_KEY = 'netball_timer_schedule';
        const MODE_STORAGE_KEY = 'netball_timer_mode';
        const BUZZER_STORAGE_KEY = 'netball_timer_buzzer';

        const DEFAULTS_4Q = {
            startTime: "09:00", periodDur: "07:00", b1: "01:00", b2: "02:00", b3: "01:00", interBrk: "2:00"
        };
        const DEFAULTS_2H = {
            startTime: "09:00", periodDur: "15:00", b1: "03:00", b2: "00:00", b3: "00:00", interBrk: "2:00"
        };
        const DEFAULTS_4ET = {
            startTime: "09:00", periodDur: "07:00", b1: "01:00", b2: "02:00", b3: "01:00",
            ftBreak: "05:00", etActive: false, etDur: "05:00", etBreak: "01:00", interBrk: "2:00"
        };

        function getDefaults() { 
            if (periodMode === '4et') return DEFAULTS_4ET;
            return periodMode === '4' ? DEFAULTS_4Q : DEFAULTS_2H; 
        }

        function init() {
            const savedMode = localStorage.getItem(MODE_STORAGE_KEY);
            if (savedMode) periodMode = savedMode;
            document.getElementById('periodSelect').value = periodMode;

            const savedBuzzer = localStorage.getItem(BUZZER_STORAGE_KEY);
            if (savedBuzzer) buzzerTone = savedBuzzer;
            document.getElementById('buzzerSelect').value = buzzerTone;
            document.getElementById('sndSiren').src = buzzerTone;

            updateEditableFields();
            loadSchedule();
            if (rounds.length === 0) {
                addRound();
            }
            setInterval(tick, 1000);
            lucide.createIcons();

            // Prevention for tab closing
            window.addEventListener('beforeunload', (e) => {
                if (isRunning) {
                    e.preventDefault();
                    e.returnValue = ''; // Standard requirement for modern browsers to show the prompt
                }
            });

            // Re-acquire Wake Lock if tab becomes visible again
            document.addEventListener('visibilitychange', async () => {
                if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
                    await requestWakeLock();
                }
            });
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        function saveSchedule() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(rounds));
        }

        function loadSchedule() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    const def = getDefaults();
                    rounds = parsed.map(r => {
                        const round = {
                            id: r.id,
                            startTime: r.startTime,
                            periodDur: r.periodDur || r.qtrDur || def.periodDur,
                            b1: r.b1 || r.q1Brk || def.b1,
                            b2: r.b2 || r.q2Brk || def.b2,
                            b3: r.b3 || r.q3Brk || def.b3,
                            interBrk: r.interBrk || def.interBrk
                        };
                        if (periodMode === '4et') {
                            round.ftBreak = r.ftBreak || def.ftBreak;
                            round.etActive = r.etActive || false;
                            round.etDur = r.etDur || def.etDur;
                            round.etBreak = r.etBreak || def.etBreak;
                        }
                        return round;
                    });
                    recalculateAll();
                } catch (e) {
                    console.error("Failed to load schedule", e);
                    rounds = [];
                }
            }
        }

        function clearSchedule() {
            if (confirm("Clear entire schedule?")) {
                rounds = [];
                localStorage.removeItem(STORAGE_KEY);
                addRound();
            }
        }

        function updateEditableFields() {
            if (periodMode === '4et') {
                EDITABLE_FIELDS = ['startTime', 'periodDur', 'b1', 'b2', 'b3', 'ftBreak', 'etActive', 'etDur', 'etBreak', 'interBrk'];
            } else if (periodMode === '4') {
                EDITABLE_FIELDS = ['startTime', 'periodDur', 'b1', 'b2', 'b3', 'interBrk'];
            } else {
                EDITABLE_FIELDS = ['startTime', 'periodDur', 'b1', 'interBrk'];
            }
        }

        function handlePeriodChange() {
            const select = document.getElementById('periodSelect');
            const newMode = select.value;
            
            if (rounds.length > 0) {
                if (!confirm("Changing the number of periods will clear the current schedule. Proceed?")) {
                    select.value = periodMode; // Revert selection
                    return;
                }
            }
            
            periodMode = newMode;
            localStorage.setItem(MODE_STORAGE_KEY, periodMode);
            updateEditableFields();
            
            rounds = [];
            localStorage.removeItem(STORAGE_KEY);
            addRound();
        }

        function handleBuzzerChange() {
            const select = document.getElementById('buzzerSelect');
            buzzerTone = select.value;
            localStorage.setItem(BUZZER_STORAGE_KEY, buzzerTone);
            document.getElementById('sndSiren').src = buzzerTone;
        }

        function tick() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('clockLayer').innerText = timeStr;
            
            if (!isRunning) {
                document.getElementById('eventLayer').innerText = "STOPPED";
                if (nextEventTarget) {
                    nextEventTarget = null;
                    render();
                }
                return;
            }
            updateLogic(now);
        }

        function updateLogic(now) {
            let nextEvent = null;
            let currentTarget = null;
            const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            for (let i = 0; i < rounds.length; i++) {
                const round = rounds[i];
                let timeline = [];
                
                if (periodMode === '4' || periodMode === '4et') {
                    timeline = [
                        { n: `R${round.id} Q1`, t: round.s1, type: 'start', field: 's1' },
                        { n: `R${round.id} End Q1`, t: round.e1, type: 'end', field: 'e1' },
                        { n: `R${round.id} Q2`, t: round.s2, type: durToSeconds(round.b1) > 0 ? 'start' : 'skip', field: 's2' },
                        { n: `R${round.id} End Q2`, t: round.e2, type: 'end', field: 'e2' },
                        { n: `R${round.id} Q3`, t: round.s3, type: durToSeconds(round.b2) > 0 ? 'start' : 'skip', field: 's3' },
                        { n: `R${round.id} End Q3`, t: round.e3, type: 'end', field: 'e3' },
                        { n: `R${round.id} Q4`, t: round.s4, type: durToSeconds(round.b3) > 0 ? 'start' : 'skip', field: 's4' },
                        { n: `R${round.id} End Q4`, t: round.e4, type: 'end', field: 'e4' }
                    ];
                    if (periodMode === '4et') {
                        const etType = round.etActive ? 'start' : 'skip';
                        const etEndType = round.etActive ? 'end' : 'skip';
                        timeline.push(
                            { n: `R${round.id} ET1`, t: round.sET1, type: etType, field: 'sET1' },
                            { n: `R${round.id} End ET1`, t: round.eET1, type: etEndType, field: 'eET1' },
                            { n: `R${round.id} ET2`, t: round.sET2, type: etType, field: 'sET2' },
                            { n: `R${round.id} End ET2`, t: round.eET2, type: etEndType, field: 'eET2' }
                        );
                    }
                } else {
                    timeline = [
                        { n: `R${round.id} H1`, t: round.s1, type: 'start', field: 's1' },
                        { n: `R${round.id} End H1`, t: round.e1, type: 'end', field: 'e1' },
                        { n: `R${round.id} H2`, t: round.s2, type: durToSeconds(round.b1) > 0 ? 'start' : 'skip', field: 's2' },
                        { n: `R${round.id} End H2`, t: round.e2, type: 'end', field: 'e2' }
                    ];
                }

                for (let ev of timeline) {
                    const evSec = timeToSeconds(ev.t);
                    const diff = evSec - currentSeconds;
                    
                    if (diff === 30 && ev.type === 'start') playSound('sndWarning');
                    if (diff === 0 && ev.type !== 'skip') playSound(ev.type === 'start' ? 'sndStart' : 'sndEnd');
                    
                    if (diff > 0) {
                        nextEvent = { name: ev.n, diff: diff };
                        currentTarget = { roundIdx: i, field: ev.field };
                        break;
                    }
                }
                if (nextEvent) break;
            }

            // Update highlighting if target changed
            if (JSON.stringify(currentTarget) !== JSON.stringify(nextEventTarget)) {
                nextEventTarget = currentTarget;
                render();
            }

            document.getElementById('eventLayer').innerText = nextEvent 
                ? `${nextEvent.name}: ${formatDuration(nextEvent.diff)}`
                : "ALL GAMES FINISHED";
        }

        function addRound() {
            const def = getDefaults();
            let start = def.startTime;
            let periodDur = def.periodDur;
            let b1 = def.b1;
            let b2 = def.b2 || "00:00";
            let b3 = def.b3 || "00:00";
            let interBrk = def.interBrk;
            let ftBreak = def.ftBreak || "05:00";
            let etActive = false;
            let etDur = def.etDur || "05:00";
            let etBreak = def.etBreak || "01:00";

            if (rounds.length > 0) {
                const last = rounds[rounds.length - 1];
                const lastEnd = periodMode === '2' ? last.e2 : (periodMode === '4et' ? last.eET2 : last.e4);
                start = secondsToTime(timeToSeconds(lastEnd) + durToSeconds(last.interBrk));
                periodDur = last.periodDur;
                b1 = last.b1;
                b2 = last.b2;
                b3 = last.b3;
                interBrk = last.interBrk;
                if (periodMode === '4et') {
                    ftBreak = last.ftBreak;
                    etActive = last.etActive;
                    etDur = last.etDur;
                    etBreak = last.etBreak;
                }
            }

            const round = { id: rounds.length + 1, startTime: start, periodDur, b1, b2, b3, interBrk };
            if (periodMode === '4et') {
                round.ftBreak = ftBreak;
                round.etActive = etActive;
                round.etDur = etDur;
                round.etBreak = etBreak;
            }
            rounds.push(round);
            recalculateAll();
        }

        function recalculateAll() {
            rounds.forEach((r, i) => {
                if (i > 0) {
                    const prev = rounds[i-1];
                    const prevEnd = periodMode === '2' ? prev.e2 : (periodMode === '4et' ? prev.eET2 : prev.e4);
                    r.startTime = secondsToTime(timeToSeconds(prevEnd) + durToSeconds(prev.interBrk));
                }
                const s1 = timeToSeconds(r.startTime);
                const d = durToSeconds(r.periodDur);
                const brk1 = durToSeconds(r.b1);
                const brk2 = (periodMode === '4' || periodMode === '4et') ? durToSeconds(r.b2) : 0;
                const brk3 = (periodMode === '4' || periodMode === '4et') ? durToSeconds(r.b3) : 0;

                r.s1 = secondsToTimeHMS(s1);
                r.e1 = secondsToTimeHMS(s1 + d);
                r.s2 = secondsToTimeHMS(s1 + d + brk1);
                r.e2 = secondsToTimeHMS(s1 + d*2 + brk1);
                
                if (periodMode === '4' || periodMode === '4et') {
                    r.s3 = secondsToTimeHMS(s1 + d*2 + brk1 + brk2);
                    r.e3 = secondsToTimeHMS(s1 + d*3 + brk1 + brk2);
                    r.s4 = secondsToTimeHMS(s1 + d*3 + brk1 + brk2 + brk3);
                    r.e4 = secondsToTimeHMS(s1 + d*4 + brk1 + brk2 + brk3);
                }

                if (periodMode === '4et') {
                    const e4sec = s1 + d*4 + brk1 + brk2 + brk3;
                    const ftBrk = durToSeconds(r.ftBreak);
                    const etD = durToSeconds(r.etDur);
                    const etBrk = durToSeconds(r.etBreak);
                    r.sET1 = secondsToTimeHMS(e4sec + ftBrk);
                    r.eET1 = secondsToTimeHMS(e4sec + ftBrk + etD);
                    r.sET2 = secondsToTimeHMS(e4sec + ftBrk + etD + etBrk);
                    r.eET2 = secondsToTimeHMS(e4sec + ftBrk + etD + etBrk + etD);
                }
            });
            saveSchedule();
            render();
        }

        function render() {
            const thead = document.querySelector('#roundTable thead');
            if (periodMode === '4et') {
                thead.innerHTML = `
                    <tr>
                        <th>Round #</th>
                        <th>Start Time</th>
                        <th>Qtr Duration</th>
                        <th>Q1 Break</th>
                        <th>Q2 Break</th>
                        <th>Q3 Break</th>
                        <th>FT Break</th>
                        <th>ET Active</th>
                        <th>ET Duration</th>
                        <th>ET Break</th>
                        <th>Interval</th>
                        <th>Start Q1</th>
                        <th>End Q1</th>
                        <th>Start Q2</th>
                        <th>End Q2</th>
                        <th>Start Q3</th>
                        <th>End Q3</th>
                        <th>Start Q4</th>
                        <th>End Q4</th>
                        <th>Start ET1</th>
                        <th>End ET1</th>
                        <th>Start ET2</th>
                        <th>End ET2</th>
                        <th></th>
                    </tr>
                `;
            } else if (periodMode === '4') {
                thead.innerHTML = `
                    <tr>
                        <th>Round #</th>
                        <th>Start Time</th>
                        <th>Qtr Duration</th>
                        <th>Q1 Break</th>
                        <th>Q2 Break</th>
                        <th>Q3 Break</th>
                        <th>Interval</th>
                        <th>Start Q1</th>
                        <th>End Q1</th>
                        <th>Start Q2</th>
                        <th>End Q2</th>
                        <th>Start Q3</th>
                        <th>End Q3</th>
                        <th>Start Q4</th>
                        <th>End Q4</th>
                        <th></th>
                    </tr>
                `;
            } else {
                thead.innerHTML = `
                    <tr>
                        <th>Round #</th>
                        <th>Start Time</th>
                        <th>Half Duration</th>
                        <th>Half Break</th>
                        <th>Interval</th>
                        <th>Start H1</th>
                        <th>End H1</th>
                        <th>Start H2</th>
                        <th>End H2</th>
                        <th></th>
                    </tr>
                `;
            }

            let styleTag = document.getElementById('dynamic-table-styles');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'dynamic-table-styles';
                document.head.appendChild(styleTag);
            }
            if (periodMode === '4et') {
                styleTag.innerHTML = `
                    th:nth-child(1) { width: 40px; }
                    th:nth-child(n+2):nth-child(-n+11) { width: 75px; }
                    th:nth-child(n+12):nth-child(-n+23) { width: 70px; }
                    th:nth-child(24) { width: 50px; }
                    table { min-width: 1600px; }
                `;
            } else if (periodMode === '4') {
                styleTag.innerHTML = `
                    th:nth-child(1) { width: 40px; }
                    th:nth-child(n+2):nth-child(-n+7) { width: 85px; }
                    th:nth-child(n+8):nth-child(-n+15) { width: 70px; }
                    th:nth-child(16) { width: 50px; }
                    table { min-width: 1200px; }
                `;
            } else {
                styleTag.innerHTML = `
                    th:nth-child(1) { width: 40px; }
                    th:nth-child(n+2):nth-child(-n+5) { width: 85px; }
                    th:nth-child(n+6):nth-child(-n+9) { width: 70px; }
                    th:nth-child(10) { width: 50px; }
                    table { min-width: 800px; }
                `;
            }

            const body = document.getElementById('tableBody');
            body.innerHTML = rounds.map((r, i) => {
                const isTargetRow = nextEventTarget && nextEventTarget.roundIdx === i;
                
                const getHighlightClass = (field) => {
                    return (isTargetRow && nextEventTarget.field === field) ? 'next-event-highlight' : '';
                };

                let rowHtml = `<tr><td>${r.id}</td>`;
                EDITABLE_FIELDS.forEach(f => {
                    if (f === 'etActive') {
                        const checked = r.etActive ? 'checked' : '';
                        rowHtml += `<td class="editable"><input type="checkbox" ${checked} onchange="toggleEtActive(${i}, this.checked)"></td>`;
                    } else {
                        rowHtml += `<td class="editable" onclick="edit(${i}, '${f}')" data-idx="${i}" data-field="${f}">${r[f]}</td>`;
                    }
                });

                rowHtml += `<td class="calculated ${getHighlightClass('s1')}">${r.s1}</td>`;
                rowHtml += `<td class="calculated ${getHighlightClass('e1')}">${r.e1}</td>`;
                rowHtml += `<td class="calculated ${getHighlightClass('s2')}">${r.s2}</td>`;
                rowHtml += `<td class="calculated ${getHighlightClass('e2')}">${r.e2}</td>`;

                if (periodMode === '4' || periodMode === '4et') {
                    rowHtml += `<td class="calculated ${getHighlightClass('s3')}">${r.s3}</td>`;
                    rowHtml += `<td class="calculated ${getHighlightClass('e3')}">${r.e3}</td>`;
                    rowHtml += `<td class="calculated ${getHighlightClass('s4')}">${r.s4}</td>`;
                    rowHtml += `<td class="calculated ${getHighlightClass('e4')}">${r.e4}</td>`;
                }

                if (periodMode === '4et') {
                    rowHtml += `<td class="calculated ${getHighlightClass('sET1')}">${r.sET1}</td>`;
                    rowHtml += `<td class="calculated ${getHighlightClass('eET1')}">${r.eET1}</td>`;
                    rowHtml += `<td class="calculated ${getHighlightClass('sET2')}">${r.sET2}</td>`;
                    rowHtml += `<td class="calculated ${getHighlightClass('eET2')}">${r.eET2}</td>`;
                }

                rowHtml += `<td><button class="btn btn-link text-danger p-0" onclick="del(${i})"><i data-lucide="x-circle"></i></button></td></tr>`;
                return rowHtml;
            }).join('');
            lucide.createIcons();
        }

        function toggleEtActive(idx, checked) {
            rounds[idx].etActive = checked;
            saveSchedule();
        }

        function edit(idx, field) {
            const cell = event.currentTarget;
            if (cell.querySelector('input')) return;

            const oldVal = rounds[idx][field];
            cell.innerHTML = `<input type="text" class="cell-edit" value="${oldVal}" id="active-edit">`;
            const input = document.getElementById('active-edit');
            input.select();

            const saveAndExit = () => {
                if (saveAndExit.done) return;
                saveAndExit.done = true;
                const newVal = formatInput(input.value, field);
                rounds[idx][field] = newVal;
                recalculateAll();
            };

            input.onblur = saveAndExit;

            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    input.blur();
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    saveAndExit();
                    
                    const fieldIdx = EDITABLE_FIELDS.indexOf(field);
                    
                    if (e.shiftKey) {
                        if (fieldIdx > 0) {
                            setTimeout(() => {
                                const prevCell = document.querySelector(`td[data-idx="${idx}"][data-field="${EDITABLE_FIELDS[fieldIdx-1]}"]`);
                                if (prevCell) prevCell.click();
                            }, 10);
                        } else if (idx > 0) {
                            setTimeout(() => {
                                const prevCell = document.querySelector(`td[data-idx="${idx-1}"][data-field="${EDITABLE_FIELDS[EDITABLE_FIELDS.length-1]}"]`);
                                if (prevCell) prevCell.click();
                            }, 10);
                        }
                    } else {
                        if (fieldIdx < EDITABLE_FIELDS.length - 1) {
                            setTimeout(() => {
                                const nextCell = document.querySelector(`td[data-idx="${idx}"][data-field="${EDITABLE_FIELDS[fieldIdx+1]}"]`);
                                if (nextCell) nextCell.click();
                            }, 10);
                        } else if (idx < rounds.length - 1) {
                            setTimeout(() => {
                                const nextCell = document.querySelector(`td[data-idx="${idx+1}"][data-field="${EDITABLE_FIELDS[0]}"]`);
                                if (nextCell) nextCell.click();
                            }, 10);
                        } else {
                            addRound();
                            setTimeout(() => {
                                const nextCell = document.querySelector(`td[data-idx="${idx+1}"][data-field="${EDITABLE_FIELDS[0]}"]`);
                                if (nextCell) nextCell.click();
                            }, 20);
                        }
                    }
                }
            };
        }

        function formatInput(v, f) {
            if (!v.includes(':') && v.trim() !== "") {
                const num = parseInt(v) || 0;
                return num.toString().padStart(2, '0') + ":00";
            }
            return v;
        }

        function timeToSeconds(t) { const p = t.split(':').map(Number); return p[0]*3600 + p[1]*60 + (p[2]||0); }
        function durToSeconds(d) { const [m, s] = d.split(':').map(Number); return m*60 + (s||0); }
        function secondsToTime(s) { 
            const h = Math.floor(s/3600) % 24; 
            const m = Math.floor((s%3600)/60); 
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }
        function secondsToTimeHMS(s) {
            const h = Math.floor(s/3600) % 24;
            const m = Math.floor((s%3600)/60);
            const sec = s % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }
        function formatDuration(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2, '0')}`; }
        
        function del(i) { 
            if (confirm("Delete this round?")) {
                rounds.splice(i, 1); 
                rounds.forEach((r,idx)=>r.id=idx+1); 
                recalculateAll(); 
            }
        }
        
        function startTimer() { 
            isRunning = true; 
            document.getElementById('periodSelect').disabled = true;
            requestWakeLock();
        }

        function stopTimer() { 
            isRunning = false; 
            document.getElementById('periodSelect').disabled = false;
            nextEventTarget = null;
            releaseWakeLock();
            render();
        }

        function playSound(id) { const a = document.getElementById(id); if(a) { a.currentTime = 0; a.play().catch(()=>{}); } }
        function manualSiren() { if(confirm("Are you sure you want to sound the siren?")) playSound('sndSiren'); }
        const CONFIGS_KEY = 'netball_timer_configs';

        function getSavedConfigs() {
            try { return JSON.parse(localStorage.getItem(CONFIGS_KEY)) || {}; } catch { return {}; }
        }

        function openSaveDialog() {
            document.getElementById('saveNameInput').value = '';
            new bootstrap.Modal(document.getElementById('saveModal')).show();
            setTimeout(() => document.getElementById('saveNameInput').focus(), 300);
        }

        function confirmSave() {
            const name = document.getElementById('saveNameInput').value.trim();
            if (!name) return;
            const configs = getSavedConfigs();
            configs[name] = { periodMode, rounds: rounds.map(r => {
                const saved = {
                    startTime: r.startTime, periodDur: r.periodDur,
                    b1: r.b1, b2: r.b2, b3: r.b3, interBrk: r.interBrk
                };
                if (periodMode === '4et') {
                    saved.ftBreak = r.ftBreak;
                    saved.etActive = r.etActive;
                    saved.etDur = r.etDur;
                    saved.etBreak = r.etBreak;
                }
                return saved;
            })};
            localStorage.setItem(CONFIGS_KEY, JSON.stringify(configs));
            bootstrap.Modal.getInstance(document.getElementById('saveModal')).hide();
        }

        function openLoadDialog() {
            const configs = getSavedConfigs();
            const names = Object.keys(configs);
            if (names.length === 0) { alert("No saved schedules found."); return; }
            const sel = document.getElementById('loadSelect');
            sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
            new bootstrap.Modal(document.getElementById('loadModal')).show();
        }

        function confirmLoad() {
            const name = document.getElementById('loadSelect').value;
            const config = getSavedConfigs()[name];
            if (!config) return;
            periodMode = String(config.periodMode);
            localStorage.setItem(MODE_STORAGE_KEY, periodMode);
            document.getElementById('periodSelect').value = periodMode;
            updateEditableFields();
            rounds = config.rounds.map((r, i) => ({ id: i + 1, ...r }));
            recalculateAll();
            bootstrap.Modal.getInstance(document.getElementById('loadModal')).hide();
        }

        window.onload = init;
    </script>
</body>
